<!DOCTYPE html>
<html lang="pt-BR" data-dir="lv">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#F5F3EF"><title>Gestão Comercial · Pereira Braga</title></head>
<body style="margin:0">
<title>Painel de Gestão PB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600;700&display=swap">
<style>
/* Família Comando, sempre escura, em 3 personalidades:
   B1 Plantão: sala de controle, grade de pontos, números em fonte de terminal, LED de estado.
   B2 Bordô e Marinho: identidade da casa, preto quente, filetes dourados, números com serifa.
   B3 Radar: vidro e profundidade, medidores em anel para a meta, cantos amplos.
   Cores fixas: BPC vinho, AA azul-marinho (tons claros para ler sobre o escuro). Faróis: <90 vermelho, 90 a 99,9 âmbar, >=100 verde. */
:root{
  --bg:#090C12; --surface:#0F141D; --raise:#141B27; --ink:#EAEFF6; --ink-2:#A9B3C4; --ink-3:#74809A; --line:#1E2735; --line-2:#172030;
  --bpc:#E06A77; --bpc-2:#F3A2AB; --bpc-soft:#1E1318; --aa:#7EA6F0; --aa-2:#B6CBF5; --aa-soft:#101A2B;
  --good:#4FD08A; --good-bg:#0F2A1D; --warn:#F0BE4E; --warn-bg:#2A2310; --bad:#FF7D70; --bad-bg:#2E1513;
  --gold:#C9A764; --accent:#9FB3CF;
  --proto:#B9A3E3; --proto-bg:#1B1726;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-head:"Manrope",system-ui,sans-serif;
  --r:8px; --kpi-size:28px; --gap:10px; --card-pad:14px;
  --tile-bg:linear-gradient(180deg,var(--raise),var(--surface));
  --page-bg:radial-gradient(circle at 1px 1px,#1A2230 1px,transparent 1.2px) 0 0/22px 22px, var(--bg);
  --lbl-case:uppercase; --lbl-track:.08em; --lbl-size:11px;
  color-scheme:dark;
}
:root[data-dir="b2"]{
  --bg:#0E0B0F; --surface:#151117; --raise:#1B161D; --ink:#F3EEE7; --ink-2:#C2B8AE; --ink-3:#8C8179; --line:#2B2329; --line-2:#211B21;
  --bpc:#DB6A7A; --bpc-2:#EFA5AF; --bpc-soft:#24141A; --aa:#86A6E6; --aa-2:#BACBEF; --aa-soft:#131A28;
  --gold:#CDAA66; --accent:#CDAA66;
  --f-label:"Manrope",system-ui,sans-serif; --f-num:"Fraunces",Georgia,serif; --f-head:"Fraunces",Georgia,serif;
  --r:4px; --kpi-size:34px; --gap:12px; --card-pad:16px;
  --tile-bg:var(--surface);
  --page-bg:radial-gradient(60% 50% at 0% 0%,rgba(139,0,0,.22),transparent 70%),radial-gradient(55% 50% at 100% 0%,rgba(13,43,94,.38),transparent 70%),var(--bg);
  --lbl-case:uppercase; --lbl-track:.16em; --lbl-size:10.5px;
}
:root[data-dir="b3"]{
  --bg:#060910; --surface:rgba(19,26,39,.72); --raise:rgba(27,36,53,.75); --ink:#EEF3FA; --ink-2:#AEB9CC; --ink-3:#77839A; --line:rgba(140,165,205,.14); --line-2:rgba(140,165,205,.08);
  --bpc:#EC7887; --bpc-2:#F6B1B9; --bpc-soft:rgba(236,120,135,.08); --aa:#84AEFA; --aa-2:#BCD0F8; --aa-soft:rgba(132,174,250,.08);
  --accent:#84AEFA;
  --f-label:"Manrope",system-ui,sans-serif; --f-num:"Sora",system-ui,sans-serif; --f-head:"Sora",system-ui,sans-serif;
  --r:16px; --kpi-size:30px; --gap:14px; --card-pad:18px;
  --tile-bg:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--kc,#84AEFA) 18%,transparent),transparent 62%),var(--surface);
  --page-bg:radial-gradient(70% 45% at 15% -5%,rgba(236,120,135,.14),transparent 70%),radial-gradient(70% 50% at 90% 0%,rgba(132,174,250,.16),transparent 70%),var(--bg);
  --lbl-case:none; --lbl-track:.01em; --lbl-size:12.5px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--page-bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
:root[data-dir="b2"] header.top{border-bottom:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.mono{flex:none;width:38px;height:38px;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--ink);border-radius:9px;background:linear-gradient(135deg,var(--bpc) 0 50%,var(--aa) 50% 100%);color:#fff}
:root[data-dir="b2"] .mono{border-radius:50%;background:transparent;border:1px solid var(--gold);color:var(--gold);font-size:16px;font-weight:600}
:root[data-dir="b3"] .mono{border-radius:12px;background:conic-gradient(from 210deg,var(--bpc),var(--aa),var(--bpc));box-shadow:0 0 0 1px var(--line)}
.brand-t{display:flex;flex-direction:column;min-width:0}
.brand-t b{font-family:var(--f-head);font-size:17px;font-weight:700;letter-spacing:.005em}
:root[data-dir="b2"] .brand-t b{font-weight:600;font-size:19px}
.cut{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap} .cut strong{color:var(--ink)}
.live{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
nav.tabs a{font-family:var(--f-body);font-weight:600;font-size:14px;color:var(--ink-2);text-decoration:none;padding:6px 11px;border-radius:7px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
:root[data-dir="b1"] nav.tabs a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent),inset 0 0 0 1px var(--line)}
:root[data-dir="b2"] nav.tabs{background:transparent;border:0;gap:16px;padding:0}
:root[data-dir="b2"] nav.tabs a{padding:6px 0;border-radius:0}
:root[data-dir="b2"] nav.tabs a[aria-current="page"]{background:transparent;box-shadow:inset 0 -1px 0 var(--gold);color:var(--gold)}
:root[data-dir="b3"] nav.tabs{border-radius:999px}
:root[data-dir="b3"] nav.tabs a{border-radius:999px;padding:6px 14px}
.proto{background:var(--proto-bg);color:var(--proto);font-size:13px;padding-block:7px}
.proto .wrap{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.dirs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.dirs button{font:inherit;font-size:13px;font-weight:600;color:var(--proto);background:transparent;border:1px solid currentColor;border-radius:999px;padding:3px 11px;cursor:pointer}
.dirs button[aria-pressed="true"]{background:var(--proto);color:var(--proto-bg)}
main .wrap{padding-block:24px 64px;display:flex;flex-direction:column;gap:calc(var(--gap) + 14px)}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.sec-h h2{font-family:var(--f-head);font-size:22px;margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
:root[data-dir="b2"] .sec-h h2{font-size:32px;font-weight:500}
:root[data-dir="b3"] .sec-h h2{font-size:26px;font-weight:600}
.sec-h p{margin:0;color:var(--ink-3);font-size:13px}
.lbl{font-family:var(--f-label);font-weight:600;font-size:var(--lbl-size);letter-spacing:var(--lbl-track);text-transform:var(--lbl-case);color:var(--ink-3)}
:root[data-dir="b2"] .lbl{color:var(--gold)}
.blk{display:flex;flex-direction:column;gap:10px}
:root[data-dir="b1"] .blk>.lbl::before{content:"▍";color:var(--accent);margin-right:4px}
:root[data-dir="b2"] .blk>.lbl{display:flex;align-items:center;gap:12px}
:root[data-dir="b2"] .blk>.lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 50%,transparent),transparent)}
.grid-k{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
@media (max-width:900px){.grid-k{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--tile-bg);border:1px solid var(--line);border-radius:var(--r);padding:var(--card-pad);display:flex;flex-direction:column;gap:5px;min-width:0;position:relative;overflow:hidden}
:root[data-dir="b1"] .kpi{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
:root[data-dir="b1"] .kpi::after{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;background:var(--kc,transparent);border-radius:0 0 2px 2px;opacity:.9}
:root[data-dir="b2"] .kpi{border:0;border-top:1px solid color-mix(in srgb,var(--gold) 55%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--kc,transparent) 9%,var(--surface)),var(--surface))}
:root[data-dir="b3"] .kpi{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px -18px rgba(0,0,0,.8)}
.kpi .v{font-family:var(--f-num);font-size:var(--kpi-size);font-weight:600;letter-spacing:-.02em;line-height:1.1}
:root[data-dir="b1"] .kpi .v{font-weight:500;letter-spacing:-.03em}
:root[data-dir="b2"] .kpi .v{font-weight:500;letter-spacing:-.01em}
.kpi .s{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.kpi .led{position:absolute;right:14px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--ledc,var(--ink-3));box-shadow:0 0 0 3px color-mix(in srgb,var(--ledc,var(--ink-3)) 18%,transparent)}
:root:not([data-dir="b1"]) .kpi .led{display:none}
.spark{height:30px;margin-top:4px}
.spark svg{display:block;width:100%;height:30px}
.d-good{color:var(--good);font-weight:700} .d-bad{color:var(--bad);font-weight:700} .d-flat{color:var(--ink-3);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-body);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.card{background:var(--tile-bg);border:1px solid var(--line);border-radius:var(--r);padding:var(--card-pad);min-width:0}
:root[data-dir="b2"] .card{border:0;border-top:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:var(--surface)}
:root[data-dir="b3"] .card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h3{margin:0 0 2px;font-family:var(--f-head);font-size:16px;font-weight:700}
:root[data-dir="b2"] .card h3{font-size:20px;font-weight:500}
.card .sub{margin:0 0 12px;color:var(--ink-3);font-size:13px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--ink-3)}
:root[data-dir="b1"] .chart text{font-family:var(--f-num);font-size:10.5px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:3}
/* medidores (B3) */
.rings{display:grid;grid-template-columns:repeat(var(--nr,3),minmax(0,1fr));gap:var(--gap)}
@media (max-width:720px){.rings{grid-template-columns:minmax(0,1fr)}}
.ring{background:var(--tile-bg);border:1px solid var(--line);border-radius:var(--r);padding:var(--card-pad);display:flex;align-items:center;gap:18px;min-width:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ring svg{flex:none;width:118px;height:118px}
.ring .rt{display:flex;flex-direction:column;gap:4px;min-width:0}
.ring .rt b{font-family:var(--f-head);font-size:17px}
.ring .rt span{font-size:13px;color:var(--ink-2)}
.ring text{font-family:var(--f-num)}
/* semanas */
.weeks{display:grid;grid-template-columns:repeat(var(--nw),minmax(178px,1fr));gap:var(--gap);overflow-x:auto;padding-bottom:4px}
.wk{font:inherit;text-align:left;color:inherit;background:var(--tile-bg);border:1px solid var(--line);border-radius:var(--r);padding:var(--card-pad);display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
:root[data-dir="b2"] .wk{border:0;border-left:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:transparent;border-radius:0;padding:4px 0 4px 14px}
.wk[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--accent)}
:root[data-dir="b2"] .wk[aria-pressed="true"]{box-shadow:none;border-left:2px solid var(--gold);background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 8%,transparent),transparent)}
.wk .wh{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.wk .wh b{font-family:var(--f-num);font-size:17px}
.wk .wh small{color:var(--ink-3);font-size:12px}
.wk dl{display:grid;grid-template-columns:auto auto;gap:3px 10px;margin:0;font-size:13px}
.wk dt{color:var(--ink-3);white-space:nowrap} .wk dd{margin:0;text-align:right;font-weight:600;white-space:nowrap}
:root[data-dir="b1"] .wk dd{font-family:var(--f-num);font-weight:500;font-size:12.5px}
.wk dd .ar{font-size:10px;margin-left:3px}
.wk .short{font-size:11px;color:var(--warn);font-weight:700}
.copybox{display:flex;flex-direction:column;gap:8px}
.copybox pre{margin:0;white-space:pre-wrap;font-family:var(--f-body);font-size:13.5px;line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--ink)}
:root[data-dir="b1"] .copybox pre{font-family:var(--f-num);font-size:12.5px}
.btn{font:inherit;font-size:14px;font-weight:700;color:var(--bg);background:var(--ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;align-self:flex-start}
:root[data-dir="b2"] .btn{background:var(--gold);color:#1A140C;border-radius:2px}
:root[data-dir="b3"] .btn{border-radius:999px;background:linear-gradient(90deg,var(--bpc),var(--aa));color:#fff}
/* operações */
.op{border-radius:var(--r);border:1px solid var(--line);background:var(--tile-bg);overflow:hidden;min-width:0}
:root[data-dir="b3"] .op{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.op-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.op-h h3{margin:0;font-family:var(--f-head);font-size:18px;font-weight:700}
:root[data-dir="b2"] .op-h h3{font-size:24px;font-weight:500}
.op.bpc .op-h{background:linear-gradient(90deg,var(--bpc-soft),transparent);box-shadow:inset 3px 0 0 var(--bpc)}
.op.aa .op-h{background:linear-gradient(90deg,var(--aa-soft),transparent);box-shadow:inset 3px 0 0 var(--aa)}
:root[data-dir="b2"] .op{border:0;border-top:2px solid var(--opc)}
:root[data-dir="b2"] .op-h{box-shadow:none!important}
.op-b{padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
@media (max-width:460px){.mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini div{display:flex;flex-direction:column;min-width:0}
.mini .v{font-family:var(--f-num);font-size:21px;font-weight:600}
:root[data-dir="b2"] .mini .v{font-size:25px;font-weight:500}
.mini small{color:var(--ink-3);font-size:12px}
.funnel{display:flex;flex-direction:column;gap:8px}
.f-row{display:grid;grid-template-columns:minmax(0,9.5em) 5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:14px}
.f-row b{font-family:var(--f-num);font-weight:600}
.bar{height:10px;background:var(--line-2);border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:0 4px 4px 0}
:root[data-dir="b3"] .bar span{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.18))}
.rate{color:var(--ink-2);font-size:13px}
.split{display:flex;height:12px;gap:2px;border-radius:4px;overflow:hidden}
/* tabelas */
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
:root[data-dir="b2"] .tbl-w{border:0;border-top:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
table{border-collapse:collapse;width:100%;font-size:14px}
table.wide{min-width:960px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
:root[data-dir="b1"] td{font-family:var(--f-num);font-size:13px}
:root[data-dir="b1"] td.who,:root[data-dir="b1"] td .badge,:root[data-dir="b1"] td .pill{font-family:var(--f-body)}
th{font-family:var(--f-label);font-weight:600;font-size:var(--lbl-size);letter-spacing:var(--lbl-track);text-transform:var(--lbl-case);color:var(--ink-3);background:var(--surface);position:sticky;top:0}
:root[data-dir="b2"] th{color:var(--gold)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--raise)}
tr.tot td{font-weight:700;border-top:1px solid var(--line)}
td.who{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tag{font-size:11px;font-weight:700;color:var(--ink-3)}
.hist{color:var(--ink-3)}
.note{font-size:13px;color:var(--ink-3);margin:0;max-width:78ch}
.meta-bars{display:flex;flex-direction:column;gap:10px}
.mb{display:grid;grid-template-columns:minmax(0,8em) minmax(0,1fr) 7.5em;gap:10px;align-items:center;font-size:14px}
.track{position:relative;height:12px;background:var(--line-2);border-radius:6px}
.track span{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.track i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2)}
/* anúncios */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;font-family:var(--f-body)}
.b-q{background:var(--good-bg);color:var(--good)} .b-c{background:var(--good-bg);color:var(--good);box-shadow:inset 0 0 0 1px var(--good)} .b-x{background:var(--bad-bg);color:var(--bad)} .b-n{background:var(--line-2);color:var(--ink-3)}
.code{font-weight:700}
.heroes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
@media (max-width:820px){.heroes{grid-template-columns:minmax(0,1fr)}}
.hero{background:var(--tile-bg);border:1px solid var(--line);border-radius:var(--r);padding:var(--card-pad);display:flex;flex-direction:column;gap:6px;min-width:0}
:root[data-dir="b2"] .hero{border:0;border-top:1px solid color-mix(in srgb,var(--gold) 55%,transparent);background:var(--surface)}
.hero .big{font-family:var(--f-num);font-size:30px;font-weight:600}
:root[data-dir="b2"] .hero .big{font-weight:500;font-size:34px}
.hero p{margin:0;font-size:13.5px;color:var(--ink-2)}
/* motivos */
.reasons{display:flex;flex-direction:column;gap:9px}
.rs{display:grid;grid-template-columns:minmax(0,14em) minmax(0,1fr) 8.5em;gap:10px;align-items:center;font-size:14px}
.rs .n{color:var(--ink-2);text-align:right;white-space:nowrap}
:root[data-dir="b1"] .rs .n{font-family:var(--f-num);font-size:12.5px}
@media (max-width:560px){.rs{grid-template-columns:minmax(0,1fr) 7em}.rs .bar{grid-column:1/-1;order:3}}
.heat td.h{text-align:center;font-weight:700;min-width:64px}
.insight{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
:root[data-dir="b1"] .insight{border-left:2px solid var(--bad)}
.insight b{white-space:normal}.insight>span{min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.kpi .v{white-space:nowrap}
@media (max-width:600px){
  header.top{position:static}
  .kpi .v{font-size:min(var(--kpi-size),24px)}
  .sec-h h2{font-size:22px!important}
  .kpi{padding:12px}
  .ring svg{width:96px;height:96px}
}
.logo{flex:none;height:46px;width:auto;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45))}
.firm{font-family:var(--f-label);font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
@media (max-width:600px){.logo{height:38px}}
.acts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--gap)}
@media (max-width:820px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.act{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);border-top:2px solid var(--ac)}
.act b{font-family:var(--f-num);font-size:26px;font-weight:500;color:var(--ink)}
.act span{font-size:12.5px;color:var(--ink-2);font-weight:600}
button.act{font:inherit;text-align:left;cursor:pointer;color:inherit}button.act:hover{border-color:var(--ac)}button.act.on{background:var(--surface-2,var(--surface));box-shadow:inset 0 0 0 2px var(--ac)}.acts.filtra button.act:not(.on){opacity:.45}
.fl-on{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fl-on button{background:none;border:1px solid var(--line);color:inherit;border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);white-space:nowrap}
.a-up{--ac:var(--good)} .a-ok{--ac:var(--gold)} .a-down{--ac:var(--warn)} .a-stop{--ac:var(--bad)} .a-redo{--ac:var(--proto)} .a-obs{--ac:var(--ink-3)}
table.ads td{vertical-align:top}
table.ads th.srt{cursor:pointer;user-select:none;white-space:nowrap}table.ads th.srt:hover{color:var(--accent)}table.ads th.on{color:var(--accent)}
.ordbtn{background:none;border:1px solid var(--line,#444);color:inherit;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.sub2{font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:normal;max-width:30ch}
.invc{display:flex;flex-direction:column;gap:4px;min-width:90px}
.invc i{display:block;height:4px;border-radius:2px;opacity:.85}
td.c-good{color:var(--good);font-weight:700} td.c-bad{color:var(--bad);font-weight:700}
td.s7 .c-good{color:var(--good);font-weight:700}td.s7 .c-warn{color:var(--warn);font-weight:700}td.s7 .c-bad{color:var(--bad);font-weight:700}td.s7{min-width:150px}
details.how summary{cursor:pointer;font-weight:700;font-family:var(--f-head)}
details.how ul{margin:10px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px;display:flex;flex-direction:column;gap:6px;max-width:90ch}
.src{display:inline-flex;align-items:center;gap:4px;margin-right:8px;white-space:nowrap}
.src i{width:7px;height:7px;border-radius:50%;display:inline-block}
.prev{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--gap)}
.pv{display:flex;flex-direction:column;gap:4px;padding:var(--card-pad);border-top:1px solid color-mix(in srgb,var(--gold) 55%,transparent);background:var(--surface);border-radius:var(--r);min-width:0}
.pvn{font-size:12.5px;color:var(--ink-2);font-weight:600}
.pvv{font-family:var(--f-num);font-size:30px;font-weight:500;line-height:1.1}
.pvs{font-size:12.5px;color:var(--ink-3)}
.rumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--gap)}
.rm{display:flex;flex-direction:column;gap:12px;padding:var(--card-pad);background:var(--surface);border-radius:var(--r);border:1px solid var(--line);border-top:3px solid var(--opc);min-width:0}
.rm-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rm-n,.rm-r{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.rm b.c-good{color:var(--good)}.rm b.c-bad{color:var(--bad)}
.rm-n div,.rm-r div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rm small{font-size:11.5px;color:var(--ink-3)}
table.wide tr.conc td,table.ads tr.conc td{color:var(--ink-2);font-style:italic;border-top:1px dashed var(--line)}
table.pcl td.reg,table.pcl th.reg{border-left:1px dashed var(--line);color:var(--ink-2)}
table.pcl tr.ia td{border-top:2px solid var(--line);font-style:italic}
table.pcl tr.saiu td{border-top:1px dashed var(--line);color:var(--ink-2)}
.rm b{font-family:var(--f-num);font-size:26px;font-weight:500;line-height:1.1;color:var(--ink)}
.rm-r b{font-size:22px}
.pv .pill{align-self:flex-start}
.pendbar{font-size:13.5px;color:var(--ink-2);padding:8px 10px;border-radius:var(--r);background:var(--raise);border:1px solid var(--line)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Tema "Lovable" (v4 visual, 17/11/2026): identidade do PB Comercial, decisão do Kevin (projetos/PL/identidade-dashboards.md).
   Página clara #F5F3EF, Lato, BPC vinho #9E1B32, AA marinho #0D2C6C, dourado #C9A84C, painel principal grafite #1A1B20 estilo TV. ===== */
:root[data-dir="lv"]{
  --bg:#F5F3EF; --surface:#FFFFFF; --raise:#FBFAF7; --ink:#1A1B20; --ink-2:#4A4C55; --ink-3:#8A8C94; --line:#E6E1D7; --line-2:#EFEBE4;
  --bpc:#9E1B32; --bpc-2:#C24A5E; --bpc-soft:#F7E9EC; --aa:#0D2C6C; --aa-2:#3F5F9E; --aa-soft:#E8EDF6;
  --good:#1F8A4C; --good-bg:#E4F3EA; --warn:#B07A12; --warn-bg:#FBF1DC; --bad:#C0392B; --bad-bg:#FBE7E4;
  --gold:#C9A84C; --accent:#9C7F2E;
  --f-body:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif; --f-label:"Lato",system-ui,sans-serif; --f-num:"Lato",system-ui,sans-serif; --f-head:"Lato",system-ui,sans-serif;
  --r:14px; --kpi-size:32px; --gap:14px; --card-pad:18px;
  --tile-bg:#FFFFFF; --page-bg:var(--bg);
  --lbl-case:uppercase; --lbl-track:.12em; --lbl-size:11px;
  color-scheme:light;
}
:root[data-dir="lv"] body{font-size:15px}
:root[data-dir="lv"] header.top{background:color-mix(in srgb,#F5F3EF 90%,transparent);border-bottom:2px solid var(--gold)}
:root[data-dir="lv"] .brand-t b{font-weight:900;font-size:19px;letter-spacing:.01em}
:root[data-dir="lv"] nav.tabs{background:transparent;border:0;gap:18px;padding:0}
:root[data-dir="lv"] nav.tabs a{padding:6px 0;border-radius:0;color:var(--ink-2);font-weight:700}
:root[data-dir="lv"] nav.tabs a[aria-current="page"]{background:transparent;box-shadow:inset 0 -2px 0 var(--gold);color:var(--ink)}
:root[data-dir="lv"] select{background:#fff;border-color:var(--line);color:var(--ink)}
:root[data-dir="lv"] .sec-h h2{font-size:28px;font-weight:900;letter-spacing:-.01em}
:root[data-dir="lv"] .lbl{color:var(--ink-2);font-weight:700}
:root[data-dir="lv"] .blk>.lbl{display:flex;align-items:center;gap:10px}
:root[data-dir="lv"] .blk>.lbl::before{content:"";width:18px;height:2px;background:var(--gold);border-radius:2px}
:root[data-dir="lv"] .kpi,:root[data-dir="lv"] .card,:root[data-dir="lv"] .pv,:root[data-dir="lv"] .act,:root[data-dir="lv"] .tbl-w{box-shadow:0 1px 2px rgba(26,27,32,.05),0 8px 24px -16px rgba(26,27,32,.25)}
:root[data-dir="lv"] .kpi{border:1px solid var(--line);border-top:3px solid var(--kc,var(--gold))}
:root[data-dir="lv"] .kpi .v{font-weight:900;letter-spacing:-.01em}
:root[data-dir="lv"] .card{border:1px solid var(--line)}
:root[data-dir="lv"] .card h3{font-weight:900}
:root[data-dir="lv"] table th{color:var(--ink-3);font-weight:700}
:root[data-dir="lv"] .insight{background:#fff;border-color:var(--line)}
:root[data-dir="lv"] table.heat td.h{background:none!important;color:var(--ink)!important;border-bottom:1px solid var(--line-2)}
:root[data-dir="lv"] table.heat td.h.alto{font-weight:900;color:var(--bpc)!important}
:root[data-dir="lv"] .zero{color:var(--ink-3)!important;font-weight:400!important}
/* painel principal escuro estilo TV: cartões de vidro e luzes desfocadas sobre a página clara */
:root[data-dir="lv"] .tv{position:relative;overflow:hidden;background:#1A1B20;border-radius:20px;padding:22px;isolation:isolate;
  --ink:#F5F3EF; --ink-2:#CFCAC0; --ink-3:#9A968E; --line:rgba(255,255,255,.12); --surface:rgba(255,255,255,.06);
  --bpc:#E2788A; --aa:#86A8EC; --good:#5FD38E; --good-bg:rgba(95,211,142,.14); --warn:#F2C35B; --warn-bg:rgba(242,195,91,.14); --bad:#FF8A7A; --bad-bg:rgba(255,138,122,.14);
  color:var(--ink);box-shadow:0 20px 50px -28px rgba(26,27,32,.7)}
:root[data-dir="lv"] .tv::before,:root[data-dir="lv"] .tv::after{content:"";position:absolute;z-index:-1;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.45}
:root[data-dir="lv"] .tv::before{background:#9E1B32;left:-120px;top:-180px}
:root[data-dir="lv"] .tv::after{background:#0D2C6C;right:-120px;bottom:-200px;opacity:.6}
:root[data-dir="lv"] .tv>.lbl{color:#E9D9A6}
:root[data-dir="lv"] .tv>.lbl::before{background:var(--gold)}
:root[data-dir="lv"] .tv .rm{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-top:3px solid var(--opc);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
:root[data-dir="lv"] .tv .rm b{color:#fff;font-weight:900}
:root[data-dir="lv"] .tv .note{color:var(--ink-2)}
:root[data-dir="lv"] .tv details.how{background:transparent;border:0;padding:0;margin-top:4px}
:root[data-dir="lv"] .tv details.how summary{color:#E9D9A6;font-size:13px;font-weight:700;cursor:pointer}
.pg{position:relative;height:12px;border-radius:999px;background:rgba(127,127,127,.22);margin:2px 0 14px}
.pg>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--opc)}
.pg>.tk{position:absolute;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.35)}
.pg>.tk::after{content:attr(data-t);position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink-3)}
.pg>.mk{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;border-radius:3px;background:#C9A84C;box-shadow:0 0 0 2px rgba(201,168,76,.25)}
.pg>.mk::after{content:attr(data-t);position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:#C9A84C;white-space:nowrap}

/* ===== v5 (17/11/2026): UI/UX do PB Comercial — topo em pílulas, tema claro/escuro, vidro, brilho e movimento ===== */
:root[data-dir="lv"]{--glass:rgba(255,255,255,.72);--glass-b:rgba(26,27,32,.08);--glass-hi:rgba(255,255,255,.9);--chip:#fff;--chip-on:#1A1B20;--chip-on-ink:#F5F3EF;
  --page-bg:radial-gradient(45% 35% at 8% 0%,rgba(158,27,50,.07),transparent 70%),radial-gradient(45% 40% at 100% 10%,rgba(13,44,108,.07),transparent 70%),#F5F3EF}
:root[data-dir="lv"][data-mode="dark"]{
  --bg:#101115; --surface:rgba(255,255,255,.045); --raise:rgba(255,255,255,.07); --ink:#F2EFE9; --ink-2:#C2BDB3; --ink-3:#8E8A82; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
  --bpc:#E2788A; --bpc-2:#EFA1AE; --bpc-soft:rgba(226,120,138,.10); --aa:#86A8EC; --aa-2:#B3C8F3; --aa-soft:rgba(134,168,236,.10);
  --good:#5FD38E; --good-bg:rgba(95,211,142,.13); --warn:#F2C35B; --warn-bg:rgba(242,195,91,.13); --bad:#FF8A7A; --bad-bg:rgba(255,138,122,.13);
  --gold:#D4B45E; --accent:#D4B45E; --tile-bg:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  --glass:rgba(22,23,28,.62); --glass-b:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.14); --chip:rgba(255,255,255,.06); --chip-on:#F2EFE9; --chip-on-ink:#101115;
  --page-bg:radial-gradient(50% 40% at 5% 0%,rgba(158,27,50,.30),transparent 70%),radial-gradient(55% 45% at 100% 8%,rgba(13,44,108,.45),transparent 70%),radial-gradient(40% 40% at 50% 100%,rgba(201,168,76,.07),transparent 70%),#101115;
  color-scheme:dark}
:root[data-dir="lv"] html,:root[data-dir="lv"]{background:var(--bg)}
:root[data-dir="lv"] body{background:var(--page-bg);background-attachment:fixed}
/* topo */
:root[data-dir="lv"] header.top{background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid var(--glass-b);box-shadow:0 1px 0 rgba(201,168,76,.55)}
:root[data-dir="lv"] header .controls{display:none}
:root[data-dir="lv"] .top .wrap{gap:10px 16px;padding-block:12px 10px}
:root[data-dir="lv"] .brand{flex:1 1 auto}
.ctl-r{display:none}
:root[data-dir="lv"] .ctl-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.ctl2{display:none}
:root[data-dir="lv"] .ctl2{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;flex-basis:100%;min-width:0}
.mrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;min-width:0;flex:1 1 280px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent)}
.mrow::-webkit-scrollbar{display:none}
.mchip,.seg button,.tema{font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid var(--glass-b);background:var(--chip);color:var(--ink-2);border-radius:999px;padding:7px 14px;white-space:nowrap;transition:background .2s,color .2s,transform .2s,box-shadow .2s,border-color .2s}
.mchip:hover,.seg button:hover,.tema:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.mchip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent;box-shadow:0 2px 0 var(--gold),0 8px 18px -10px rgba(0,0,0,.6)}
.mchip.parc:not(.on){border-style:dashed}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--chip);border:1px solid var(--glass-b);gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:6px 14px}
.seg button.on{background:var(--chip-on);color:var(--chip-on-ink);box-shadow:0 6px 16px -10px rgba(0,0,0,.7)}
.seg button[data-o="BPC"].on{background:#9E1B32;color:#fff}.seg button[data-o="AA"].on{background:#0D2C6C;color:#fff}
.selo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#8A6D1E;background:rgba(201,168,76,.14);border:1px solid rgba(201,168,76,.55);border-radius:999px;padding:5px 11px;white-space:nowrap}
:root[data-mode="dark"] .selo{color:#E6CF8C}
.selo::before{content:"";width:7px;height:7px;border-radius:50%;background:#C9A84C;box-shadow:0 0 0 0 rgba(201,168,76,.6);animation:respira 2.6s ease-in-out infinite}
.tema{display:inline-flex;align-items:center;gap:6px;padding:7px 11px}
.tema svg{width:16px;height:16px}
:root[data-dir="lv"] nav.tabs{flex-basis:100%;gap:22px}
:root[data-dir="lv"] nav.tabs a{position:relative;transition:color .2s}
:root[data-dir="lv"] nav.tabs a[aria-current="page"]{box-shadow:none}
:root[data-dir="lv"] nav.tabs a::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--gold);transform:scaleX(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
:root[data-dir="lv"] nav.tabs a[aria-current="page"]::after{transform:scaleX(1)}
:root[data-dir="lv"] .cut{font-size:12px}
@media (max-width:700px){
  :root[data-dir="lv"] header.top{position:sticky;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)!important;box-shadow:0 1px 0 rgba(201,168,76,.55),0 10px 24px -18px rgba(0,0,0,.35)}
  :root[data-dir="lv"] .cut .srcs{display:none}
  :root[data-dir="lv"] .firm{font-size:9.5px}
  :root[data-dir="lv"] .brand-t b{font-size:17px}
  :root[data-dir="lv"] .tema span{display:none}
  :root[data-dir="lv"] nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around;gap:0;padding:8px 6px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 14px 34px -14px rgba(0,0,0,.45)}
  :root[data-dir="lv"] nav.tabs a{font-size:12.5px;padding:6px 4px}
  :root[data-dir="lv"] main .wrap{padding-bottom:110px}
}
/* vidro nos cartões */
:root[data-dir="lv"] .kpi,:root[data-dir="lv"] .card,:root[data-dir="lv"] .act,:root[data-dir="lv"] .tbl-w,:root[data-dir="lv"] .insight,:root[data-dir="lv"] .pv,:root[data-dir="lv"] .filters{background:var(--tile-bg);border:1px solid var(--glass-b);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
:root[data-dir="lv"]:not([data-mode="dark"]) .kpi,:root[data-dir="lv"]:not([data-mode="dark"]) .card,:root[data-dir="lv"]:not([data-mode="dark"]) .act,:root[data-dir="lv"]:not([data-mode="dark"]) .tbl-w,:root[data-dir="lv"]:not([data-mode="dark"]) .insight,:root[data-dir="lv"]:not([data-mode="dark"]) .filters{background:rgba(255,255,255,.78)}
:root[data-dir="lv"] .kpi{border-top:3px solid var(--kc,var(--gold));box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px -22px rgba(26,27,32,.5)}
:root[data-dir="lv"] .kpi,:root[data-dir="lv"] .card,:root[data-dir="lv"] .act,:root[data-dir="lv"] .rm{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
:root[data-dir="lv"] .kpi:hover,:root[data-dir="lv"] .card:hover,:root[data-dir="lv"] .act:hover,:root[data-dir="lv"] .rm:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 36px -20px rgba(26,27,32,.55)}
:root[data-dir="lv"][data-mode="dark"] .insight{background:rgba(255,255,255,.05)}
/* cartões de ação mais leves */
:root[data-dir="lv"] .act{border-top:1px solid var(--glass-b);padding:12px 14px;border-radius:16px}
:root[data-dir="lv"] .act span{display:flex;align-items:center;gap:7px}
:root[data-dir="lv"] .act span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}

function gerarFicticio(){
  let s=20261109; const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pois=l=>{if(l<=0)return 0;if(l>30)return Math.max(0,Math.round(l+Math.sqrt(l)*(r()+r()+r()-1.5)*1.4));let L=Math.exp(-l),k=0,p=1;do{k++;p*=r()}while(p>L);return k-1};
  const pick=w=>{const t=Object.values(w).reduce((a,b)=>a+b,0);let x=r()*t;for(const k in w){x-=w[k];if(x<=0)return k}return Object.keys(w)[0]};
  const out=[]; const fim=D(DADOS_ATE);
  for(let dt=D("2026-06-01");dt<=fim;dt.setDate(dt.getDate()+1)){
    const d=iso(dt), wd=dt.getDay(), fds=(wd===0||wd===6), f=fds?.5:1;
    const closers=op=>CAD.filter(c=>c.op===op&&c.cad!=="LID"&&d>=c.de&&(!c.ate||d<=c.ate));
    ADS.forEach(a=>{
      if(a.fr==="DI"&&d<"2026-07-01")return;
      const inv=+(a.g*f*(.85+r()*.3)).toFixed(2), conv=pois(a.cv*f), leads=Math.round(conv*(.78+r()*.1));
      const q=pois(leads*a.q*1.0), c=fds?pois(q*.15):pois(q*a.c);
      out.push({d,op:a.op,cad:a.fr,m:"invest",v:inv});out.push({d,op:a.op,cod:a.cod,m:"ad_inv",v:inv});
      if(conv){out.push({d,op:a.op,cad:a.fr,m:"conversas",v:conv});out.push({d,op:a.op,cod:a.cod,m:"ad_conv",v:conv})}
      if(leads)out.push({d,op:a.op,cod:a.cod,m:"ad_leads",v:leads});
      if(q)out.push({d,op:a.op,cod:a.cod,m:"ad_q",v:q});
      if(c)out.push({d,op:a.op,cod:a.cod,m:"ad_c",v:c});
      if(leads)out.push({d,op:a.op,cod:a.cod,m:"s_leads",v:leads});if(q)out.push({d,op:a.op,cod:a.cod,m:"s_q",v:q});if(q&&r()<a.c)out.push({d,op:a.op,cod:a.cod,m:"s_c",v:Math.max(1,Math.round(q*a.c))});
      const nq=Math.round((leads-q)*.8); const acc={};
      for(let i=0;i<nq;i++){const k=pick(a.mix);acc[k]=(acc[k]||0)+1}
      for(const k in acc)out.push({d,op:a.op,cod:a.cod,m:"nq",mot:k,v:acc[k]});
      const pd=pois(q*.35); const ap={};
      for(let i=0;i<pd;i++){const k=pick(PERDA[a.op]);ap[k]=(ap[k]||0)+1}
      for(const k in ap)out.push({d,op:a.op,cod:a.cod,m:"perda",mot:k,v:ap[k]});
      const cs=closers(a.op);
      if(cs.length){[["leads",leads],["qualif",q],["contratos",c]].forEach(([m,v])=>{for(let i=0;i<v;i++){const cc=cs[Math.floor(r()*cs.length)];out.push({d,op:a.op,cad:cc.cad,m,v:1})}});
        for(let i=0;i<c;i++){const cc=cs[Math.floor(r()*cs.length)];if(r()<.9)out.push({d:addDias(d,fds?2:1)<=DADOS_ATE?addDias(d,fds?2:1):d,op:a.op,cad:cc.cad,m:"checklists",v:1})}}
    });
    if(r()<.03){const cc=CAD.filter(c=>c.cad!=="LID"&&d>=c.de&&(!c.ate||d<=c.ate));const x=cc[Math.floor(r()*cc.length)];out.push({d,op:x.op,cad:x.cad,m:"churns",v:1})}
    if(r()<.04)out.push({d,op:"BPC",cad:"LID",m:"contratos",v:1});
  }
  return out;
}

/* ===== utilidades ===== */
function iso(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}

function periodos(){
  const meses=[...new Set(BASE.map(x=>x.d.slice(0,7)))].sort().reverse();
  return meses.map(k=>{
    const fimMes=ultimoDia(k), parcial=DADOS_ATE<fimMes, fim=parcial?DADOS_ATE:fimMes, ini=k+"-01", n=(D(fim)-D(ini))/864e5+1;
    const [y,m]=k.split("-").map(Number), kAnt=iso(new Date(y,m-2,1,12)).slice(0,7), antIni=kAnt+"-01";
    const antFim=parcial?(n<=+ultimoDia(kAnt).slice(8)?addDias(antIni,n-1):ultimoDia(kAnt)):ultimoDia(kAnt);
    return {k,ini,fim,parcial,antIni,antFim,label:mesNome(k)+(parcial?" · até "+brc(fim)+" (parcial)":" · fechado")};
  });
}
function semanas(p){ /* segunda a domingo, cortadas no mês; S1 pode ser curta */
  const out=[]; let a=p.ini; const fimMes=ultimoDia(p.k);
  while(a<=fimMes){ let b=a; while(D(b).getDay()!==0&&b<fimMes)b=addDias(b,1);
    out.push({n:out.length+1,ini:a,fim:b,dias:(D(b)-D(a))/864e5+1,futura:a>DADOS_ATE,parcial:b>DADOS_ATE&&a<=DADOS_ATE,fimDado:b>DADOS_ATE?DADOS_ATE:b}); a=addDias(b,1)}
  return out;
}
function soma(a,b,filtro){const t={};for(const x of BASE){if(x.d<a||x.d>b)continue;if(filtro&&!filtro(x))continue;t[x.m]=(t[x.m]||0)+x.v}return t}
/* v4.0: meta por operação como no Tracker (colunas BPC e AA do C2_METAS), rateada por dia útil; mês sem a coluna usa a soma das cadeiras.
   Usada nas páginas Comercial e Operações. A página Closers segue com a meta de cada closer. */
/* v5 (17/11, pedido da PL 00): no mês em andamento a meta "até o corte" é o esperado pela curva da TV (meta do mês × curva até o corte),
   o mesmo número do bloco "Vamos bater a meta"; mês fechado ou recorte livre segue o rateio por dia útil. */
function metaEsperada(a,b,op){
  const k=a.slice(0,7),fm=ultimoDia(k);
  if(a===k+"-01"&&b.slice(0,7)===k&&b<fm){const c=curvaMes(k,b);if(c!=null)return metaOpPeriodo(a,fm,op)*c}
  return metaOpPeriodo(a,b,op);
}
function metaOpPeriodo(a,b,op){
  let tot=0;
  for(let k=a.slice(0,7);k<=b.slice(0,7);){
    const mi=k+"-01",mf=ultimoDia(k),ra=a>mi?a:mi,rb=b<mf?b:mf,f=diasUteis(ra,rb)/diasUteis(mi,mf);
    (op==="ALL"?["BPC","AA"]:[op]).forEach(o=>{const v=(META[k]||{})[o];tot+=(v!=null?v:metaPeriodo(mi,mf,cadsOp(o)))*f});
    const [y,m]=k.split("-").map(Number);k=iso(new Date(y,m,1,12)).slice(0,7);
  }
  return tot;
}
function metaPeriodo(a,b,cads){
  let tot=0;
  for(let k=a.slice(0,7);k<=b.slice(0,7);){
    const mi=k+"-01",mf=ultimoDia(k),ra=a>mi?a:mi,rb=b<mf?b:mf,f=diasUteis(ra,rb)/diasUteis(mi,mf);
    cads.forEach(c=>{tot+=((META[k]||{})[c]||0)*f});
    const [y,m]=k.split("-").map(Number);k=iso(new Date(y,m,1,12)).slice(0,7);
  }
  return tot;
}
function farol(p,ritmo){if(p==null||!isFinite(p))return "";const c=p>=1?"p-good":p>=.9?"p-warn":"p-bad",t=p>=1?(ritmo?"no ritmo":"bateu"):p>=.9?"perto":"abaixo";return `<span class="pill ${c}">${fmtP(p)} · ${t}</span>`}
function delta(a,b,menorMelhor){
  if(a==null||b==null||!b)return `<span class="d-flat">sem base</span>`;
  const v=a/b-1;if(Math.abs(v)<.005)return `<span class="d-flat">= 0%</span>`;
  const bom=menorMelhor?v<0:v>0;return `<span class="${bom?"d-good":"d-bad"}">${v>0?"▲":"▼"} ${Math.abs(v*100).toFixed(0)}%</span>`;
}
/* v5.2 (17/11, decisão da PL 00): mês fechado inteiro mostra o líquido do fechamento oficial (C2_LIQUIDOS, o número pago);
   mês em andamento e recortes livres seguem a base. Por operação usa a coluna BPC/AA; por closer, a coluna da cadeira. */
function liqFechado(a,b,f){
  const k=a.slice(0,7);if(a!==k+"-01"||b!==ultimoDia(k)||k>=DADOS_ATE.slice(0,7))return null;
  const L=LIQ_F&&LIQ_F[k];if(!L)return null;
  if(!f)return (L.BPC||0)+(L.AA||0);
  const fB=f({op:"BPC",cad:"__"}),fA=f({op:"AA",cad:"__"});
  if(fB&&!fA)return L.BPC!=null?L.BPC:null;if(fA&&!fB)return L.AA!=null?L.AA:null;
  let soma_=0,achou=false;
  for(const cad in L){if(cad==="BPC"||cad==="AA")continue;const c=CAD.find(x=>x.cad===cad),op=c?c.op:(cad.startsWith("AA")?"AA":"BPC");
    if(f({op,cad})){soma_+=L[cad];achou=true}}
  return achou?soma_:null;
}
function kpis(a,b,f){
  const t=soma(a,b,f),lf=liqFechado(a,b,f),liq=lf!=null?lf:(t.contratos||0)-(t.churns||0);
  return {inv:t.invest||0,conv:t.conversas||0,leads:t.leads||0,q:t.qualif||0,c:t.contratos||0,ch:t.churns||0,liq,chk:t.checklists||0,
    cpc:div(t.invest,t.conversas),cpq:div(t.invest,t.qualif),cac:div(t.invest,liq),pq:div(t.qualif,t.leads),pf:div(t.contratos,t.qualif)};
}

function perdasCloser(op,a,b,cod){

  for(const x of BASE){if((x.m!=="pc"&&x.m!=="pc_regua")||x.op!==op||x.d<a||x.d>b)continue;if(cod&&x.cod!==cod)continue;tem=true;

    (t[q]||(t[q]={}))[x.mot]=((t[q]||{})[x.mot]||0)+x.v;sum[q]=(sum[q]||0)+x.v}
  return {t,sum,reg,tem};
}
/* nome na aba da TP → cadeira do cadastro (tira "Dr."/"Dra." e compara nome inteiro ou primeiro nome); quem não está no cadastro fica com o nome */
function resolverCloser(q){if(q==="IA"||CAD.some(c=>c.cad===q))return q;
  const nm=String(q).replace(/^(dra?|doutora?)\.?\s+/i,"").trim().toLowerCase(),p1=nm.split(/\s+/)[0];
  const c=CAD.find(c=>c.cad!=="LID"&&(String(c.pessoa).toLowerCase()===nm||String(c.pessoa).toLowerCase()===p1));return c?c.cad:q}

function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function spark(vals,color){
  const W=200,H=28,mx=Math.max(1,...vals),n=vals.length;if(n<2)return "";
  const pts=vals.map((v,i)=>[i*W/(n-1),H-3-v/mx*(H-6)]);
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="M0,${H} L${pts.map(p=>p.join(",")).join(" L")} L${W},${H} Z" fill="${color}" opacity=".12"/><polyline fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" points="${pts.map(p=>p.join(",")).join(" ")}"/></svg></div>`;
}
function lineChart(el,series,xs,aria){
  const W=640,H=230,L=40,R=70,T=12,B=26,iw=W-L-R,ih=H-T-B;
  const max=Math.max(1,...series.flatMap(s=>s.vals)),step=niceStep(max/4),top=Math.ceil(max/step)*step;
  const x=i=>L+(xs.length<2?0:i*iw/(xs.length-1)),y=v=>T+ih-v/top*ih;
  let g="";for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line-2")}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmtN(v)}</text>`;
  [0,Math.floor((xs.length-1)/2),xs.length-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===xs.length-1?"end":"middle"}">${brc(xs[i])}</text>`);
  series.forEach(s=>{const pts=s.vals.map((v,i)=>[x(i),y(v)]);
    if(!s.dash)g+=`<path d="M${pts[0][0]},${y(0)} L${pts.map(p=>p.join(",")).join(" L")} L${pts[pts.length-1][0]},${y(0)} Z" fill="${s.color}" opacity=".08"/>`;
    g+=`<polyline fill="none" stroke="${s.color}" stroke-width="${s.dash?1.5:2}" ${s.dash?'stroke-dasharray="4 4"':""} stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    const lp=pts[pts.length-1];if(!s.dash)g+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" fill="${s.color}" stroke="${css("--surface")}" stroke-width="2"/>`;
    g+=`<text x="${lp[0]+8}" y="${lp[1]+4}" style="fill:${css("--ink-2")};font-weight:600">${s.label}</text>`});
  g+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="${css("--ink-3")}" opacity="0"/><rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" class="hit"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">${g}</svg><div class="tip"></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),xh=svg.querySelector(".xh"),hit=svg.querySelector(".hit");
  hit.addEventListener("pointermove",ev=>{const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(xs.length-1,Math.round((px-L)/iw*(xs.length-1))));
    xh.setAttribute("x1",x(i));xh.setAttribute("x2",x(i));xh.setAttribute("opacity",".5");
    tip.innerHTML=`<b>${br(xs[i])}</b><br>`+series.map(s=>`${s.label}: <b>${fmtN(s.vals[i])}</b>`).join("<br>");
    tip.style.left=(x(i)/W*r.width)+"px";tip.style.top=(T/H*r.height+10)+"px";tip.style.opacity=1});
  hit.addEventListener("pointerleave",()=>{tip.style.opacity=0;xh.setAttribute("opacity","0")});
}
function stackCols(el,cats,stacks,aria){

  const tot=cats.map((_,i)=>stacks.reduce((a,s)=>a+s.vals[i],0)),max=Math.max(1,...tot),step=niceStep(max/4),top=Math.ceil(max/step)*step;

  cats.forEach((c,i)=>{let acc=0;stacks.forEach((s,j)=>{const v=s.vals[i];if(!v)return;const gap=acc>0?2:0,y0=y(acc)-gap,y1=y(acc+v),last=j===stacks.length-1;
      g+=last?`<path d="M${cx(i)-bw/2},${y0} V${y1+4} q0,-4 4,-4 H${cx(i)+bw/2-4} q4,0 4,4 V${y0} Z" fill="${s.color}"/>`:`<rect x="${cx(i)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1)}" fill="${s.color}"/>`;acc+=v});
    g+=`<text x="${cx(i)}" y="${y(tot[i])-6}" text-anchor="middle" style="fill:${css("--ink-2")};font-weight:600">${fmtN(tot[i])}</text><text x="${cx(i)}" y="${H-6}" text-anchor="middle">${c}</text>`;

  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">${g}</svg><div class="tip"></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip");

    tip.style.left=(cx(i)/W*r.width)+"px";tip.style.top=(y(tot[i])/H*r.height)+"px";tip.style.opacity=1});h.addEventListener("pointerleave",()=>tip.style.opacity=0)});
}

/* v4.0 (19/11/2026): "Vamos bater a meta" por operação. Realizado = contratos líquidos do mês até o corte; meta do mês (Tracker);
   falta = meta − realizado; precisa por dia útil = falta ÷ dias úteis que restam depois do corte; ritmo atual = realizado ÷ dias úteis até o corte.
   Farol = ritmo atual ÷ ritmo necessário (abaixo de 90% vermelho, 90 a 99,9% âmbar, 100%+ verde). Dias úteis sem feriados, como no rateio da meta. */
/* Curva da TV (ficha V4.6, 17/11): dias úteis do mês (sem feriado nacional); 1ª metade (arredondada para cima) pesa 0,9 e a 2ª pesa 1,1.
   Curva até um dia = soma dos pesos até ele ÷ soma dos pesos do mês. Feriado e fim de semana não somam peso. */
function curvaMes(k,ate){
  const dias=[];for(let d=k+"-01",f=ultimoDia(k);d<=f;d=addDias(d,1))if(diasUteisF(d,d))dias.push(d);
  const h=Math.ceil(dias.length/2),w=i=>i<h?0.9:1.1;let tot=0,acc=0;
  dias.forEach((d,i)=>{tot+=w(i);if(d<=ate)acc+=w(i)});
  return tot?acc/tot:null;
}

function anoInfo(y){

  let hist=0;for(const k in (A.historico||{}))hist+=(A.historico[k].BPC||0)+(A.historico[k].AA||0);

  for(let m=1;m<=12;m++){const k=y+"-"+String(m).padStart(2,"0");if((A.historico||{})[k]||k>mAtual)continue;
    if(k<mAtual&&LIQ_F[k]){real+=(LIQ_F[k].BPC||0)+(LIQ_F[k].AA||0);usouF++;continue}

const BASE_INI=()=>BASE.reduce((m,x)=>x.d<m?x.d:m,"9999");
function rumoMeta(p,op){

     V4.2 meta da operação (C2_METAS); V4.4 ritmo realizado = V4.1 ÷ dias úteis decorridos; V4.5 ritmo necessário = (V4.2 − V4.1) ÷ dias úteis restantes;

/* ===== Anúncios ===== */
/* Corte: gasto (Meta) e funil (TP 04) só se comparam até a data mais antiga das duas fontes. */
const MIN_Q=3;
const REGUA_PADRAO={contrato:250,min_conversas:20,taxa_qualif_bpc:.035,taxa_qualif_aa:.016,folga_aumento:.9,limite_ambar:1.11,vermelho_grave:1.5,mult_baixo_volume:3,fonte:"padrão do painel (cópia do regras.yaml de 10/11/2026)",
  /* Sinal de 7 dias do e-mail da TP (regras.yaml, cópia de 16/11/2026): custo por qualificado máximo (TEA e AA desde 11/11, DI e BPC desde 12/11),
     gasto sem qualificado e custo por conversa máximo (regra do Kevin de 11/11: acima de R$ 20 o anúncio entra em revisão) */
  conversa_max:20,cpq_max:{TEA:205,DI:205,BPC:205,AA:155},sem_q_max:{TEA:640,AA:1000},fonte7:"regras.yaml da TP, cópia de 16/11/2026"};
const RG=()=>Object.assign({},REGUA_PADRAO,REG||{});
const ehAnuncio=c=>/^(TEA|DI|AA|BPC|MISTO)\s/i.test(c);
const semGasto=()=>!BASE.some(x=>x.m==="ad_inv");
function corteAnuncios(){const f=FUNIL_ATE||DADOS_ATE;return f<DADOS_ATE?f:DADOS_ATE}
function porAnuncio(a,b,modo){
  const g={},safra=modo==="lead",mL=safra?"s_leads":"ad_leads",mQ=safra?"s_q":"ad_q",mC=safra?"s_c":"ad_c";
  for(const x of BASE){if(!x.cod||x.d<a||x.d>b)continue;if(st.op!=="ALL"&&x.op!==st.op)continue;
    const o=g[x.op+"|"+x.cod]||(g[x.op+"|"+x.cod]={cod:x.cod,op:x.op,inv:0,conv:0,leads:0,q:0,c:0,nq:{},perda:{},temGasto:false});
    if(x.m==="ad_inv"){o.inv+=x.v;o.temGasto=true}else if(x.m==="ad_conv")o.conv+=x.v;else if(x.m===mL)o.leads+=x.v;else if(x.m===mQ)o.q+=x.v;else if(x.m===mC)o.c+=x.v;
    else if(x.m==="nq")o.nq[x.mot]=(o.nq[x.mot]||0)+x.v;else if(x.m==="perda")o.perda[x.mot]=(o.perda[x.mot]||0)+x.v}
  const sg=semGasto();
  return Object.values(g).map(o=>(sg||!o.temGasto?{...o,inv:null}:o)).map(o=>({...o,cpl:div(o.inv,o.leads),cpc:div(o.inv,o.conv),cpq:div(o.inv,o.q),cpa:div(o.inv,o.c),pq:o.q>o.leads?null:div(o.q,o.leads),
    topNq:Object.entries(o.nq).sort((x,y)=>y[1]-x[1])[0]}));
}
/* v4.0 (19/11/2026): visão por campanha. Campanha = código até o ponto (TEA 9.1 e TEA 9.3 → TEA 9; AA 4.1 a 4.9 → AA 4;
   código sem ponto, como AA 5 ou TEA 11, já é a campanha). Soma gasto, conversas, leads, qualificados, contratos e motivos dos anúncios
   e recalcula os custos; a ação sugerida e o sinal de 7 dias usam a soma da campanha. Origens que não são anúncio ficam como estão. */
const campanhaDe=c=>{if(!ehAnuncio(c))return c;const m=String(c).match(/^(\S+)\s+(\d+)/);return m?m[1].toUpperCase()+" "+(+m[2]):c};
function agruparCampanha(lista){
  const g={};
  for(const o of lista){const cod=campanhaDe(o.cod),k=o.op+"|"+cod;
    const a=g[k]||(g[k]={cod,op:o.op,inv:null,conv:0,leads:0,q:0,c:0,nq:{},perda:{},temGasto:false,ads:[]});
    if(o.inv!=null)a.inv=(a.inv||0)+o.inv;a.temGasto=a.temGasto||o.temGasto;
    a.conv+=o.conv;a.leads+=o.leads;a.q+=o.q;a.c+=o.c;if(ehAnuncio(o.cod))a.ads.push(o.cod);
    for(const m in o.nq)a.nq[m]=(a.nq[m]||0)+o.nq[m];for(const m in o.perda)a.perda[m]=(a.perda[m]||0)+o.perda[m]}
  return Object.values(g).map(o=>({...o,ads:o.ads.sort((x,y)=>x.localeCompare(y,"pt",{numeric:true})),cpl:div(o.inv,o.leads),cpc:div(o.inv,o.conv),cpq:div(o.inv,o.q),cpa:div(o.inv,o.c),pq:o.q>o.leads?null:div(o.q,o.leads),
    topNq:Object.entries(o.nq).sort((x,y)=>y[1]-x[1])[0]}));
}
/* Ação sugerida: régua da TP (R$ 250 por contrato, 30 dias, mínimo de 20 conversas) com os nomes pedidos pelo Kevin.
   Acelerar = até 90% da régua · Manter = até 111% · Frear = até 150% · Pausar = acima de 150%, ou gasto alto sem contrato.
   Com menos de 5 contratos: Pausar se gastou 3 × régua sem nenhum contrato; Frear se gastou 3 × régua × (contratos + 1);
   Refazer se atrai público errado (qualificados ÷ conversas abaixo de 3,5% no BPC ou 1,6% no AA, ou 30%+ dos não qualificados por perfil). */
const PERFIL=/renda|inelegív|não se enquadra|qualidade de segurado|sem sequela|já recebe/i;
function acao(o){
  if(o.inv==null)return semGasto()?{k:"obs",t:"Aguardando gasto",w:"o gasto por anúncio ainda não chegou"}:{k:"obs",t:"Sem gasto",w:"sem gasto na Meta nos últimos 30 dias (código antigo ou lead tardio)"};
  const R=RG();
  if(o.conv<R.min_conversas&&o.leads<R.min_conversas)return {k:"obs",t:"Observar",w:`pouco volume em 30 dias (${fmtN(Math.max(o.conv,o.leads))} conversas)`};
  const nqT=Object.values(o.nq).reduce((a,b)=>a+b,0),perfil=nqT?Object.entries(o.nq).filter(([m])=>PERFIL.test(m)).reduce((a,[,v])=>a+v,0)/nqT:0;
  const qConv=div(o.q,o.conv||o.leads),pisoQ=o.op==="AA"?R.taxa_qualif_aa:R.taxa_qualif_bpc;
  if(o.c>=5){const r=o.cpa/R.contrato;
    if(r<=R.folga_aumento)return {k:"up",t:"Acelerar",w:`custo por contrato ${fmtR0(o.cpa)}, ${Math.round(r*100)}% da régua de ${fmtR0(R.contrato)}`};
    if(r<=R.limite_ambar)return {k:"ok",t:"Manter",w:`custo por contrato ${fmtR0(o.cpa)}, na régua`};
    if(perfil>=.3)return {k:"redo",t:"Refazer",w:`${fmtP(perfil)} dos não qualificados por perfil e custo acima da régua`};
    return r<=R.vermelho_grave?{k:"down",t:"Frear",w:`custo por contrato ${fmtR0(o.cpa)}, ${Math.round(r*100)}% da régua`}:{k:"stop",t:"Pausar",w:`custo por contrato ${fmtR0(o.cpa)}, ${Math.round(r*100)}% da régua`};
  }
  if(o.c===0&&o.inv>=R.mult_baixo_volume*R.contrato)return {k:"stop",t:"Pausar",w:`${fmtR0(o.inv)} gastos e nenhum contrato`};

  const cods=lista.map(o=>o.cod).sort();

  const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
  const agrega=(L,k)=>{const t={};L.forEach(o=>{for(const m in o[k])t[m]=(t[m]||0)+o[k][m]});return t};
  const ord=t=>Object.entries(t).sort((a,b)=>b[1]-a[1]);
  const barras=(t,col,antT)=>{const tot=sum(t),at=antT?sum(antT):0;if(!tot)return `<p class="note">Sem motivo registrado no período.</p>`;
    return `<div class="reasons">${ord(t).map(([m,v])=>{const sh=v/tot,sa=at?(antT[m]||0)/at:null;
    return `<div class="rs"><span>${esc(m)}</span><span class="bar"><span style="width:${sh*100}%;background:${col}"></span></span><span class="n"><b>${fmtP(sh)}</b> · ${fmtN(v)}${sa!=null?` <span class="${sh>sa+.03?"d-bad":sh<sa-.03?"d-good":"d-flat"}" title="antes: ${fmtP(sa)}">${sh>sa+.03?"▲":sh<sa-.03?"▼":"="}</span>`:""}</span></div>`}).join("")}</div>`};
  let h=`<div class="sec-h"><h2>Motivos · ${mesNome(p.k)}</h2><p>${br(p.ini)} a ${br(p.fim)} · seta compara a fatia de cada motivo com ${vsTxt(p)} · BPC e AA separados, porque os motivos são outros</p></div>
    <div class="filters"><label class="lbl" for="adf">Anúncio</label><select id="adf"><option value="ALL">Todos os anúncios</option>${cods.map(c=>`<option ${c===st.ad?"selected":""}>${c}</option>`).join("")}</select></div>`;
  const dest=[],nqCards=[],peCards=[],heats=[];
  ops.forEach(op=>{
    const col=opCor(op),nome=op==="BPC"?"BPC":"AA";
    const Lop=lista.filter(o=>o.op===op),L=st.ad==="ALL"?Lop:Lop.filter(o=>o.cod===st.ad),A=ant.filter(o=>o.op===op&&(st.ad==="ALL"||o.cod===st.ad));
    const nq=agrega(L,"nq"),pe=agrega(L,"perda"),nqOp=agrega(Lop,"nq"),tOp=sum(nqOp);
    nqCards.push(`<div class="card"><h3>Não qualificação · ${nome}</h3><p class="sub">Datacrazy · ${fmtN(sum(nq))} leads com motivo · o maior ponto de ataque</p>${barras(nq,col,agrega(A,"nq"))}</div>`);
    peCards.push(`<div class="card"><h3>Perda depois de qualificado · ${nome}</h3><p class="sub">Pipedrive · ${fmtN(sum(pe))} negócios perdidos com motivo</p>${barras(pe,col,agrega(A,"perda"))}</div>`);
    const mots=ord(nqOp).slice(0,6).map(x=>x[0]),media={};mots.forEach(m=>media[m]=tOp?(nqOp[m]||0)/tOp:0);
    Lop.forEach(o=>{const t=sum(o.nq);if(t<15)return;mots.forEach(m=>{const v=(o.nq[m]||0)/t;if(v>media[m]*1.6&&v>.25)dest.push({o,m,v,med:media[m]})})});
    if(st.ad==="ALL"&&mots.length){
      const rows=Lop.filter(o=>sum(o.nq)).sort((a,b)=>a.cod.localeCompare(b.cod,"pt",{numeric:true})).map(o=>{const t=sum(o.nq);
        return `<tr><td><span class="code">${o.cod}</span> <span class="tag">${fmtN(t)}</span></td>${mots.map(m=>{const v=(o.nq[m]||0)/t,alpha=Math.min(.85,v*1.6);
          return `<td class="h" style="background:color-mix(in srgb, ${col} ${Math.round(alpha*100)}%, transparent);color:${alpha>.45?"#fff":"var(--ink)"}" title="${esc(m)}: ${fmtP(v)} (média ${nome} ${fmtP(media[m])})">${Math.round(v*100)}%</td>`}).join("")}</tr>`}).join("");
      heats.push(`<div class="blk"><span class="lbl">${nome} · anúncio × motivo de não qualificação</span><div class="tbl-w"><table class="heat"><thead><tr><th>Anúncio</th>${mots.map(m=>`<th style="white-space:normal;min-width:88px">${esc(m)}</th>`).join("")}</tr></thead><tbody>${rows}<tr class="tot"><td>Média ${nome}</td>${mots.map(m=>`<td class="h">${Math.round(media[m]*100)}%</td>`).join("")}</tr></tbody></table></div></div>`);
    }
  });
  dest.sort((a,b)=>b.v-a.v);
  if(dest.length&&st.ad==="ALL")h+=`<div class="blk"><span class="lbl">O que salta aos olhos</span>${dest.slice(0,3).map(x=>`<div class="insight"><span class="badge b-x">atenção</span><span><b>${x.o.cod}</b> <span class="tag">${x.o.op}</span> perde ${fmtP(x.v)} dos leads por "${esc(x.m)}", contra ${fmtP(x.med)} na média do ${x.o.op}. Vale olhar a segmentação e a mensagem desse anúncio.</span></div>`).join("")}</div>`;
  h+=ops.length>1?`<div class="two">${nqCards.join("")}</div><div class="two">${peCards.join("")}</div>`:`<div class="two">${nqCards[0]}${peCards[0]}</div>`;
  /* v4.1: por closer */
  const pcBlk=ops.map(op=>{
    const P=perdasCloser(op,p.ini,p.fim,st.ad==="ALL"?null:st.ad),nome=op==="BPC"?"BPC":"AA";
    if(!P.tem)return "";
    const tot={};for(const q in P.t)for(const m in P.t[q])tot[m]=(tot[m]||0)+P.t[q][m];
    const mots=Object.entries(tot).sort((x,y)=>y[1]-x[1]).slice(0,4).map(x=>x[0]);
    const quem=[...new Set([...Object.keys(P.t),...Object.keys(P.reg)])];
    const ordemCad=CAD.filter(c=>c.op===op).map(c=>c.cad);
    const fimP=p.fim,ativos=quem.filter(q=>q!=="IA"&&q!=="SAIU"),sairam=quem.filter(q=>q==="SAIU");
    const closers=ativos.sort((x,y)=>{const ix=ordemCad.indexOf(x),iy=ordemCad.indexOf(y);return (ix<0?99:ix)-(iy<0?99:iy)||String(x).localeCompare(String(y))});
    const linha=(q,cls)=>{const s=P.sum[q]||0,o=P.t[q]||{},out=s-mots.reduce((a,m)=>a+(o[m]||0),0);
      return `<tr class="${cls||""}"><td><b>${esc(nomeCloser(q,fimP))}</b>${cls==="saiu"?`<div class="sub2">perdas na carteira de quem já não está no time</div>`:""}</td><td><b>${fmtN(s)}</b></td>${mots.map(m=>{const v=o[m]||0;return `<td>${fmtN(v)}${s&&v?` <span class="tag">${fmtP(v/s)}</span>`:""}</td>`}).join("")}<td>${fmtN(out)}</td><td class="reg">${fmtN(P.reg[q]||0)}</td></tr>`};
    const totS=Object.values(P.sum).reduce((a,v)=>a+v,0),totR=Object.values(P.reg).reduce((a,v)=>a+v,0);
    return `<div class="blk"><span class="lbl">${nome} · por que perdemos · por closer</span><div class="tbl-w"><table class="wide pcl"><thead><tr><th>Closer</th><th>Perdidos com motivo</th>${mots.map(m=>`<th style="white-space:normal;min-width:96px">${esc(m)}</th>`).join("")}<th>Outros motivos</th><th class="reg" style="white-space:normal;min-width:110px">Não respondeu à régua (Sumiu)</th></tr></thead><tbody>
      ${closers.map(q=>linha(q)).join("")}${sairam.map(q=>linha(q,"saiu")).join("")}${quem.includes("IA")?linha("IA","ia"):""}
      <tr class="tot"><td>Total ${nome}</td><td>${fmtN(totS)}</td>${mots.map(m=>`<td>${fmtN(tot[m])}</td>`).join("")}<td>${fmtN(totS-mots.reduce((a,m)=>a+tot[m],0))}</td><td class="reg">${fmtN(totR)}</td></tr></tbody></table></div>
      <p class="note">Perdidos pelo motivo que a closer marcou (ranking, 5 maiores motivos da operação; o número pequeno é a fatia na carteira daquela closer). "Sumiu" é o fim da régua de follow-up, não um motivo: fica na última coluna, fora do ranking. "IA / sem dona" = perdidos sem closer dona (IA ou sem responsável), separado das closers.</p></div>`;
  }).join("");
  if(pcBlk)h+=pcBlk;
  else h+=`<div class="blk"><span class="lbl">Por que perdemos · por closer</span><p class="note">${PERDAS_ST==="aguardando a aba da TP"||!PERDAS_ST?"A fonte das perdas por closer ainda não está no ar: a TP publica a aba \"📉 Perdas por closer\" depois do ok do Kevin. Assim que ela entrar, este bloco se preenche sozinho na atualização das 08h.":"Sem perdas por closer no período ("+esc(PERDAS_ST)+")."}</p></div>`;
  if(heats.length)h+=`<p class="note">Mapa: cada célula é a fatia dos não qualificados daquele anúncio. Cor mais forte, motivo mais concentrado. Compare com a linha da média.</p>`+heats.join("");
  document.getElementById("view").innerHTML=h;
  document.getElementById("adf").onchange=e=>{st.ad=e.target.value;vMotivos()};
}


/* ===== v5: tema (automático / claro / escuro), lembrado no aparelho ===== */
let TEMA="auto";try{TEMA=localStorage.getItem("pbTema")||"auto"}catch(_){}
const MOV=!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
function aplicarTema(){const esc=TEMA==="escuro"||(TEMA==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.mode=esc?"dark":"light"}
aplicarTema();
const ICO={auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  claro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  escuro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'};
const NOME_TEMA={auto:"Automático",claro:"Claro",escuro:"Escuro"};
/* ===== v5: topo em pílulas (os seletores originais continuam por baixo, escondidos) ===== */
function desenharTopo(){
  const c2=document.getElementById("ctl2"),cr=document.getElementById("ctlr");if(!c2||!P||!st.p)return;
  const ordem=P.slice().reverse();
  const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],ano=st.p.k.slice(0,4);
  const anosDados=[...new Set(P.map(p=>p.k.slice(0,4)))].sort(),anos=[...anosDados,String(+anosDados[anosDados.length-1]+1)];
  const ops=SO_UMA_OP.includes(st.v)?[["BPC","BPC"],["AA","AA"]]:[["ALL","BPC + AA"],["BPC","BPC"],["AA","AA"]];
  c2.innerHTML=`<div class="seg ano" role="group" aria-label="Ano">${anos.map(y=>`<button type="button" data-y="${y}" class="${y===ano?"on":""}" ${anosDados.includes(y)?"":"disabled"} aria-pressed="${y===ano}">${y}</button>`).join("")}</div>
    <div class="mrow" role="group" aria-label="Mês">${MES.map((m,i)=>{const k=ano+"-"+String(i+1).padStart(2,"0"),p=P.find(x=>x.k===k);return `<button type="button" class="mchip${p===st.p?" on":""}${p&&p.parcial?" parc":""}" ${p?`data-i="${P.indexOf(p)}"`:"disabled"} aria-pressed="${p===st.p}">${m}</button>`}).join("")}</div>
    <div class="seg" role="group" aria-label="Operação">${ops.map(([o,t])=>`<button type="button" data-o="${o}" class="${st.op===o?"on":""}" aria-pressed="${st.op===o}">${t}</button>`).join("")}</div>`;
  cr.innerHTML=`<span class="selo">${st.p.parcial?"Parcial · até "+brc(st.p.fim):"Fechado"}</span><button type="button" class="tema" id="temaBtn" title="Tema: ${NOME_TEMA[TEMA]} (clique para trocar)">${ICO[TEMA]}<span>${NOME_TEMA[TEMA]}</span></button>`;
  c2.querySelectorAll(".mchip[data-i]").forEach(b=>b.onclick=()=>{selMes.value=b.dataset.i;selMes.dispatchEvent(new Event("change"))});
  c2.querySelectorAll(".seg.ano button[data-y]").forEach(b=>b.onclick=()=>{const p=P.find(x=>x.k.startsWith(b.dataset.y));if(p){selMes.value=P.indexOf(p);selMes.dispatchEvent(new Event("change"))}});
  c2.querySelectorAll(".seg button[data-o]").forEach(b=>b.onclick=()=>{if(SO_UMA_OP.includes(st.v))st.opPag=b.dataset.o;const s=document.getElementById("opf");s.value=b.dataset.o;s.dispatchEvent(new Event("change"))});
  document.getElementById("temaBtn").onclick=()=>{TEMA={auto:"claro",claro:"escuro",escuro:"auto"}[TEMA];try{localStorage.setItem("pbTema",TEMA)}catch(_){}aplicarTema();render()};
  const mr=c2.querySelector(".mrow"),on=c2.querySelector(".mchip.on");if(mr&&on)mr.scrollLeft=on.offsetLeft-mr.clientWidth/2+on.offsetWidth/2;
}
/* ===== v5: números sobem e a tela entra suave quando muda de aba, mês ou operação ===== */
let ULT_ENTRADA="";
function animarNumeros(){
  if(!MOV)return;
  document.querySelectorAll("#view .kpi .v, #view .rm b, #view .act b").forEach(e=>{
    const t=e.textContent.trim(),m=t.match(/^(R\$\s?)?(\d{1,3}(?:\.\d{3})*|\d+)(?:,(\d+))?(%?)$/);if(!m)return;
    const dec=m[3]?m[3].length:0,v=parseFloat(m[2].replace(/\./g,"")+(m[3]?"."+m[3]:""));if(!(v>0))return;
    const pre=m[1]||"",suf=m[4],t0=performance.now(),dur=750,fmt=x=>pre+x.toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
    const passo=n=>{const k=Math.min(1,(n-t0)/dur),y=1-Math.pow(1-k,3);e.textContent=k<1?fmt(v*y):t;if(k<1)requestAnimationFrame(passo)};requestAnimationFrame(passo)});
}
function entrada(){const k=st.v+"|"+(st.p&&st.p.k)+"|"+st.op;if(k===ULT_ENTRADA)return;ULT_ENTRADA=k;const v=document.getElementById("view");
  if(MOV){v.classList.remove("entra");void v.offsetWidth;v.classList.add("entra");setTimeout(()=>v.classList.remove("entra"),900)}animarNumeros()}
/* Zero em cinza (identidade do PB Comercial): número 0, R$ 0 ou 0% em tabela e cartão. Roda depois de cada desenho da tela. */
function marcarZeros(){document.querySelectorAll("#view td, #view .kpi .v, #view .act b, #view .rm b").forEach(e=>{const t=e.textContent.trim();if(/^(R\$\s?)?0([,.]0+)?%?$/.test(t))e.classList.add("zero")});
  if(st.dir==="lv")document.querySelectorAll("#view table.heat td.h").forEach(e=>{if(parseInt(e.textContent,10)>=30)e.classList.add("alto")})}
new MutationObserver(()=>marcarZeros()).observe(document.getElementById("view"),{childList:true});
const SO_UMA_OP=["anuncios","motivos"];
function render(){
  if(!st.p)return;
  /* v5.1: Anúncios e Motivos mostram uma operação por vez; ao sair, volta para a escolha anterior */
  const opf_=document.getElementById("opf");
  if(SO_UMA_OP.includes(st.v)){if(st.op==="ALL"){st.opVolta="ALL";st.op=st.opPag||"BPC";opf_.value=st.op}}
  else if(st.opVolta){st.op=st.opVolta;st.opVolta=null;opf_.value=st.op}   /* v4.0: troca de tema antes de os números chegarem não redesenha a página vazia */
  document.documentElement.dataset.dir=st.dir;
  document.querySelectorAll(".dirs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===st.dir));
  const ref=ATUALIZADO&&/^\d{2}\/\d{2}\/\d{4}/.test(ATUALIZADO)?addDias(ATUALIZADO.slice(6,10)+"-"+ATUALIZADO.slice(3,5)+"-"+ATUALIZADO.slice(0,2),-1):DADOS_ATE;
  const fonte=(nome,d)=>{const ok=d&&d>=ref;return `<span class="src" title="${nome}: ${d?br(d):"sem data"}${ok?"":" · atrasada"}"><i style="background:${ok?"var(--good)":"var(--warn)"}"></i>${nome} ${d?brc(d):"—"}</span>`};
  document.getElementById("cut").innerHTML=`Dados até <strong>${br(DADOS_ATE)}</strong><span class="srcs"> · ${fonte("Tracker",DADOS_ATE)}${fonte("Funil TP",FUNIL_ATE)}${fonte("Meta por anúncio",AN_ATE)}</span> · ${ATUALIZADO?"atualizado em "+esc(ATUALIZADO):"atualiza às 08h00"}${AVISOS?` · <span class="d-bad" title="${esc(AVISOS)}">fonte com aviso</span>`:""}`;
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===st.v?"page":"false"));
  document.getElementById("view").classList.toggle("largo",st.v==="anuncios");
  ({comercial:vComercial,operacoes:vOperacoes,closers:vClosers,anuncios:vAnuncios,motivos:vMotivos})[st.v]();
  marcarZeros();desenharTopo();entrada();
}
function boot(json){
  const d=typeof json==="string"?JSON.parse(json):json;
  DADOS_ATE=d.dadosAte;FUNIL_ATE=d.funilAte||"";AN_ATE=d.metaAnunciosAte||"";PEND=d.pendentes||{};REG=d.regua||null;ATUALIZADO=d.atualizadoEm||"";PERDAS_ST=d.perdasCloser||"";ANO=d.ano||null;LIQ_F=d.liqFechados||{};AVISOS=d.avisos||"";META=d.meta||{};
  const cores={BPC:["--bpc","--bpc-2"],AA:["--aa","--aa-2"]},usados={BPC:0,AA:0};
  CAD=(d.cad||[]).map(c=>{const op=c.op==="BPC+AA"?"BPC":c.op;let cv="--ink-3";if(c.cad!=="LID"&&cores[op])cv=cores[op][Math.min(usados[op]++,1)];return {...c,op,cv}});
  BASE=(d.base||[]).map(r=>({d:r[0],op:r[1],cad:r[2]||undefined,cod:r[3]||undefined,m:r[4],v:+r[5],mot:r[6]||undefined}));
  if(!BASE.length){document.getElementById("view").innerHTML='<p class="note">A base ainda está vazia. Rode o PASSO_2_ATUALIZAR no Apps Script.</p>';return}
  init();
}
if(PROTOTIPO)init();
else if(window.PB_DADOS)boot(window.PB_DADOS);   /* v3.5: os números chegam junto com a página */
else if(NO_APPS){
  const msg=t=>{document.getElementById("view").innerHTML='<p class="note">'+t+'</p>'};
  if(!HASH_K)msg("Acesso restrito. Peça o link ao Kevin.");
  else{msg("Carregando os números…");
    fetch(API_PB+"?f=json&k="+encodeURIComponent(HASH_K),{credentials:"omit",cache:"no-store"})
      .then(r=>r.json()).then(d=>d&&d.erro?msg("Acesso restrito. Peça o link ao Kevin."):boot(d))
      .catch(e=>msg("Não consegui carregar os números ("+esc(e&&e.message||e)+"). Tente de novo em instantes."))}}
else{document.getElementById("view").innerHTML='<p class="note">Carregando os números…</p>';
  google.script.run.withSuccessHandler(boot).withFailureHandler(e=>{document.getElementById("view").innerHTML='<p class="note">Não consegui carregar os números: '+esc(e&&e.message||e)+'</p>'}).getDados(window.PB_K||'')}
</script>
